<!doctype html>
<!-- Logo de la tarjeta de Google Wallet (sin marcas de terceros). Para regenerarlo: abrir en Chrome/Edge a 660x660 y capturar, p. ej.
     msedge --headless=new --allow-file-access-from-files --window-size=660,660 --screenshot=public/img/wallet-logo.png branding/wallet-logo.html -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'BS'; src: url('../public/fonts/big-shoulders.woff2') format('woff2'); font-weight: 700 900; }
@font-face { font-family: 'On'; src: url('../public/fonts/onest.woff2') format('woff2'); font-weight: 400 700; }
html, body { margin: 0; width: 660px; height: 660px; overflow: hidden; background: #e3b93c; }
.wrap { width: 660px; height: 660px; display: grid; place-items: center; }
.mark { display: grid; justify-items: center; gap: 6px; transform: translateY(2px); }
.crown { margin-bottom: 0; }
.crown { width: 200px; height: 92px; }
.ma { display: flex; align-items: center; gap: 18px; font: 900 112px/0.82 'BS'; color: #14120c; letter-spacing: .02em; margin-top: 30px; }
.ma i { display: block; width: 46px; height: 12px; background: #14120c; border-radius: 2px; }
.los { display: flex; align-items: center; gap: 10px; }
.plate { width: 150px; height: 186px; background: #fff; border-radius: 14px; padding: 9px; box-sizing: border-box; box-shadow: 0 0 0 5px #14120c; display: grid; grid-template-rows: 1fr auto; }
.plate .blue { background: #1d4fb8; border-radius: 6px; display: grid; place-items: center; font: 700 132px/1 'On'; color: #fff; padding-bottom: 4px; }
.plate .txt { font: 700 23px/1 'BS'; color: #d62828; text-align: center; letter-spacing: .06em; padding-top: 6px; }
.os { font: 900 220px/0.78 'BS'; color: #14120c; letter-spacing: -.01em; }
</style></head>
<body><div class="wrap"><div class="mark">
  <svg class="crown" viewBox="0 0 200 92" aria-hidden="true">
    <path d="M10 82 L22 22 L60 54 L100 8 L140 54 L178 22 L190 82 Z" fill="#14120c"/>
    <rect x="10" y="80" width="180" height="12" rx="3" fill="#14120c"/>
    <circle cx="22" cy="18" r="9" fill="#14120c"/><circle cx="100" cy="8" r="9" fill="#14120c"/><circle cx="178" cy="18" r="9" fill="#14120c"/>
  </svg>
  <div class="ma"><i></i>MA<i></i></div>
  <div class="los"><div class="plate"><div class="blue">L</div><div class="txt">PRÁCTICAS</div></div><div class="os">OS</div></div>
</div></div></body></html>
